<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Face Data Dashboard</title>
<style>
  :root { --bg:#f5f6f8; --card:#fff; --text:#1c1f24; --muted:#6b7280; --accent:#2563eb; --ok:#16a34a; --bad:#dc2626; --warn:#d97706; --border:#e5e7eb; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#0f1115; --card:#181b21; --text:#e8eaed; --muted:#9aa0a6; --border:#2a2f38; }
  }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--text); font:16px/1.5 system-ui, sans-serif; }
  main { max-width:1000px; margin:0 auto; padding:24px 16px; }
  h1 { font-size:20px; margin:0 0 4px; }
  h2 { font-size:16px; margin:0 0 12px; }
  p.sub { color:var(--muted); margin:0 0 16px; font-size:14px; }
  a { color:var(--accent); }
  .card { background:var(--card); border:1px solid var(--border); border-radius:12px; padding:16px; margin-bottom:16px; }
  .stats { display:grid; grid-template-columns:repeat(auto-fit, minmax(160px, 1fr)); gap:12px; margin-bottom:16px; }
  .stat { background:var(--card); border:1px solid var(--border); border-radius:12px; padding:12px 16px; }
  .stat .n { font-size:28px; font-weight:700; font-variant-numeric:tabular-nums; }
  .stat .l { font-size:13px; color:var(--muted); }
  .row { display:flex; flex-wrap:wrap; gap:8px; align-items:center; }
  input { padding:9px 10px; border:1px solid var(--border); border-radius:8px; background:var(--bg); color:var(--text); font-size:15px; width:160px; }
  button { padding:9px 14px; border:0; border-radius:8px; background:var(--accent); color:#fff; font-size:14px; cursor:pointer; }
  button.danger { background:var(--bad); }
  button.ghost { background:transparent; color:var(--text); border:1px solid var(--border); }
  button.small { padding:4px 10px; font-size:13px; }
  button:disabled { opacity:.5; cursor:default; }
  .scroll { overflow-x:auto; }
  table { width:100%; border-collapse:collapse; font-size:13px; }
  th, td { text-align:left; padding:6px 8px; border-bottom:1px solid var(--border); white-space:nowrap; }
  th { color:var(--muted); font-weight:600; }
  td.num { font-variant-numeric:tabular-nums; }
  .VERIFIED { color:var(--ok); } .DUPLICATE,.FAILED,.REJECTED_SPOOF { color:var(--bad); }
  .RETRY,.IN_REVIEW,.ALREADY_VERIFIED { color:var(--warn); }
  .empty { color:var(--muted); font-size:13px; }
  #msg { font-size:14px; min-height:1.5em; margin:8px 0 0; }
  #msg.err { color:var(--bad); } #msg.ok { color:var(--ok); }
</style>
</head>
<body>
<main>
  <h1>Face Data Dashboard</h1>
  <p class="sub">Dev-only. View and delete stored face data. <a href="/">Back to test page</a></p>

  <div class="stats">
    <div class="stat"><div class="n" id="cEmb">–</div><div class="l">Enrolled faces</div></div>
    <div class="stat"><div class="n" id="cRev">–</div><div class="l">Review queue</div></div>
    <div class="stat"><div class="n" id="cAtt">–</div><div class="l">Verification attempts</div></div>
  </div>

  <div class="card">
    <h2>Actions</h2>
    <div class="row">
      <input id="uid" inputmode="numeric" placeholder="User ID">
      <button id="delUser" class="danger">Delete user's data</button>
      <button id="clearRl" class="ghost">Reset rate limits</button>
      <button id="clearAll" class="danger">Clear everything</button>
      <button id="refresh" class="ghost">Refresh</button>
    </div>
    <p id="msg"></p>
  </div>

  <div class="card">
    <h2>Enrolled faces</h2>
    <div class="scroll" id="tEmb"></div>
  </div>

  <div class="card">
    <h2>Review queue</h2>
    <div class="scroll" id="tRev"></div>
  </div>

  <div class="card">
    <h2>Recent attempts</h2>
    <div class="scroll" id="tAtt"></div>
  </div>
</main>

<script>
const $ = (id) => document.getElementById(id);

function say(text, kind) {
  $('msg').textContent = text;
  $('msg').className = kind ?? '';
}

function fmt(v) {
  if (v === null || v === undefined) return '–';
  if (typeof v === 'number' && !Number.isInteger(v)) return v.toFixed(3);
  if (typeof v === 'string' && /^\d{4}-\d\d-\d\dT/.test(v)) return new Date(v).toLocaleString();
  return String(v);
}

// columns: [key, label]; rowAction(row) returns an optional element for the last column
function table(el, rows, columns, rowAction) {
  el.replaceChildren();
  if (!rows.length) {
    const p = document.createElement('div');
    p.className = 'empty';
    p.textContent = 'No rows.';
    el.append(p);
    return;
  }
  const t = document.createElement('table');
  const head = t.createTHead().insertRow();
  for (const [, label] of columns) head.append(Object.assign(document.createElement('th'), { textContent: label }));
  if (rowAction) head.append(document.createElement('th'));
  const body = t.createTBody();
  for (const r of rows) {
    const tr = body.insertRow();
    for (const [key] of columns) {
      const td = tr.insertCell();
      td.textContent = fmt(r[key]);
      if (typeof r[key] === 'number') td.className = 'num';
      if (key === 'verdict' || key === 'status') td.classList.add(r[key]);
    }
    if (rowAction) tr.insertCell().append(rowAction(r));
  }
  el.append(t);
}

function deleteButton(userId) {
  const b = Object.assign(document.createElement('button'), { className: 'danger small', textContent: 'Delete' });
  b.onclick = () => deleteUser(userId);
  return b;
}

async function api(method, url) {
  const r = await fetch(url, { method });
  const body = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(body.error ?? `HTTP ${r.status}`);
  return body;
}

async function load() {
  try {
    const d = await api('GET', '/dev/db?limit=200');
    $('cEmb').textContent = d.counts.embeddings;
    $('cRev').textContent = d.counts.review_queue;
    $('cAtt').textContent = d.counts.attempts;
    table($('tEmb'), d.face_embeddings,
      [['user_id', 'User'], ['model_version', 'Model'], ['liveness_score', 'Liveness'], ['quality_score', 'Quality'], ['created_at', 'Created'], ['updated_at', 'Updated']],
      (r) => deleteButton(r.user_id));
    table($('tRev'), d.face_review_queue,
      [['id', 'ID'], ['user_id', 'User'], ['matched_user_id', 'Matched user'], ['similarity', 'Similarity'], ['status', 'Status'], ['created_at', 'Created']]);
    table($('tAtt'), d.face_verification_attempts,
      [['created_at', 'Time'], ['user_id', 'User'], ['verdict', 'Verdict'], ['reason_code', 'Reason'], ['top_similarity', 'Top sim.'], ['liveness_score', 'Liveness'], ['latency_ms', 'ms']],
      (r) => deleteButton(r.user_id));
  } catch (err) {
    say(`Could not load data: ${err.message}`, 'err');
  }
}

function summary(deleted) {
  return Object.entries(deleted).map(([k, v]) => `${v} ${k.replace('_', ' ')}`).join(', ');
}

async function deleteUser(id) {
  id = String(id).trim();
  if (!/^\d+$/.test(id)) return say('Enter a numeric user ID.', 'err');
  if (!confirm(`Delete all face data for user ${id}?`)) return;
  try {
    const { deleted } = await api('DELETE', `/dev/users/${id}`);
    say(`User ${id}: deleted ${summary(deleted)}.`, 'ok');
  } catch (err) {
    say(`Delete failed: ${err.message}`, 'err');
  }
  load();
}

$('delUser').onclick = () => deleteUser($('uid').value);

$('clearAll').onclick = async () => {
  if (!confirm('Delete ALL enrolled faces, review items, attempts, sessions and rate limits?')) return;
  try {
    const { deleted } = await api('POST', '/dev/clear');
    say(`Cleared: ${summary(deleted)}.`, 'ok');
  } catch (err) {
    say(`Clear failed: ${err.message}`, 'err');
  }
  load();
};

$('clearRl').onclick = async () => {
  try {
    const { deleted } = await api('POST', '/dev/rate-limits/clear');
    say(`Rate limits reset (${deleted.redis_keys} keys).`, 'ok');
  } catch (err) {
    say(`Reset failed: ${err.message}`, 'err');
  }
};

$('refresh').onclick = () => { say(''); load(); };
load();
</script>
</body>
</html>
