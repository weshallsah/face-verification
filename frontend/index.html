<!doctype html>
<!-- DEV-ONLY REFERENCE PAGE, NOT MAINTAINED. Served at /dev/test only when DEV_MODE=true.
     The production page is /verify (frontend/verify/). Its capture code was copied from this file and
     the two are not kept in sync: do not fix bugs here expecting them to reach production. -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Face Verification Test</title>
<style>
  :root { --bg:#f5f6f8; --card:#fff; --text:#1c1f24; --muted:#6b7280; --accent:#2563eb; --ok:#16a34a; --bad:#dc2626; --warn:#d97706; --border:#e5e7eb; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#0f1115; --card:#181b21; --text:#e8eaed; --muted:#9aa0a6; --border:#2a2f38; }
  }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--text); font:16px/1.5 system-ui, sans-serif; }
  main { max-width:520px; margin:0 auto; padding:24px 16px; }
  h1 { font-size:20px; margin:0 0 4px; }
  p.sub { color:var(--muted); margin:0 0 16px; font-size:14px; }
  .card { background:var(--card); border:1px solid var(--border); border-radius:12px; padding:16px; margin-bottom:16px; }
  label { font-size:13px; color:var(--muted); display:block; margin-bottom:4px; }
  input { width:100%; padding:10px; border:1px solid var(--border); border-radius:8px; background:var(--bg); color:var(--text); font-size:16px; }
  button { width:100%; margin-top:12px; padding:12px; border:0; border-radius:8px; background:var(--accent); color:#fff; font-size:16px; cursor:pointer; }
  button:disabled { opacity:.5; cursor:default; }
  .stage { position:relative; aspect-ratio:3/4; background:#000; border-radius:12px; overflow:hidden; }
  video { width:100%; height:100%; object-fit:cover; transform:scaleX(-1); }   /* mirrored preview only; captured frames are not */
  .oval { position:absolute; inset:12% 20%; border:3px solid rgba(255,255,255,.7); border-radius:50%; transition:border-color .2s; }
  .oval.go { border-color:#22c55e; }
  .prompt { position:absolute; left:0; right:0; top:0; text-align:center; color:#fff; font-weight:700; font-size:20px; line-height:1.3; padding:16px 12px 28px; background:linear-gradient(rgba(0,0,0,.75), rgba(0,0,0,0)); text-shadow:0 1px 4px #000; }
  .prompt:empty { display:none; }
  .guide { position:absolute; left:50%; bottom:14px; transform:translateX(-50%); max-width:90%; padding:6px 14px; border-radius:999px; background:rgba(0,0,0,.65); color:#fff; font-size:15px; font-weight:600; text-align:center; }
  .guide:empty { display:none; }
  .guide.ok { background:rgba(22,163,74,.85); }
  .ring { position:absolute; inset:0; width:100%; height:100%; display:none; pointer-events:none; }
  .ring.show { display:block; }
  .ring path { fill:none; stroke:rgba(255,255,255,.45); stroke-width:9; stroke-linecap:round; transition:stroke .15s; }
  .ring path.lit { stroke:#22c55e; }
  .check { position:absolute; inset:0; display:none; align-items:center; justify-content:center; font-size:110px; color:#22c55e; text-shadow:0 2px 12px #000; pointer-events:none; }
  .check.show { display:flex; }
  .loading { position:absolute; inset:0; display:none; align-items:center; justify-content:center; color:#fff; background:rgba(0,0,0,.6); font-weight:600; }
  .loading.show { display:flex; }
  #result { font-weight:600; }
  #result.VERIFIED { color:var(--ok); } #result.DUPLICATE,#result.FAILED,#result.ERROR { color:var(--bad); }
  #result.RETRY,#result.IN_REVIEW,#result.ALREADY_VERIFIED { color:var(--warn); }
  .muted { color:var(--muted); font-size:13px; white-space:pre-line; }
</style>
</head>
<body>
<main>
  <h1>Face Verification Test</h1>
  <p class="sub">Local test tool. Uses a dev-only token endpoint. <a href="/dashboard.html" style="color:var(--accent)">Data dashboard</a></p>

  <div class="card">
    <div class="muted">Test user ID (automatic): <b id="uid"></b> &middot; <a href="#" id="newUser" style="color:var(--accent)">new test user</a></div>
    <button id="start">Start verification</button>
  </div>

  <div class="card" id="camCard" hidden>
    <div class="stage" id="stage">
      <video id="video" autoplay playsinline muted></video>
      <div class="oval" id="oval"></div>
      <div class="prompt" id="prompt"></div>
      <svg class="ring" id="ring" viewBox="0 0 300 400" preserveAspectRatio="none"></svg>
      <div class="check" id="check">&#10003;</div>
      <div class="guide" id="guide"></div>
      <div class="loading" id="loading">Loading face detection&hellip;</div>
    </div>
  </div>

  <div class="card" id="resCard" hidden>
    <div id="result"></div>
    <div class="muted" id="detail"></div>
  </div>
</main>

<script type="module">
// The browser only handles TIMING and GUIDANCE. Everything it measures is used to decide when to
// take frames; the server re-detects on the uploaded JPEGs and makes every decision itself.
// No scores are ever sent to the server.
import { FaceLandmarker, FilesetResolver } from '/vendor/mediapipe/vision_bundle.js';

const $ = (id) => document.getElementById(id);
const sleep = (ms) => new Promise((r) => setTimeout(r, ms));
const median = (a) => { const s = [...a].sort((x, y) => x - y), m = s.length >> 1; return s.length % 2 ? s[m] : (s[m - 1] + s[m]) / 2; };

// ---- Tunables (client side; the server has its own thresholds in backend/python-face-service/app/config.py) --------
const T = {
  BUF_LONG: 640,            // stored frames: long side in px
  BUF_MAX: 30,              // ~1.5 s at 20 fps
  BUF_MIN_GAP_MS: 50,       // store at most ~20 fps
  FPS_FLOOR: 10,            // below this, shrink the detection input
  DET_STEPS: [640, 480, 320],
  MIN_FACE_PX: 140,         // server min_face_px is 120 on these 640px frames; keep a margin
  CENTRE_TOL: 0.12,         // face centre vs oval centre, as a fraction of the stage
  STEADY_MS: 500,           // neutral: hold still this long before capturing
  STEADY_DRIFT: 0.03,       // neutral: max face-centre drift while "steady"
  NEUTRAL_YAW: 10, NEUTRAL_PITCH: 12,   // server neutral gate is 15 deg
  NEUTRAL_MOUTH: 0.30,      // server neutral gate is 0.35
  NEUTRAL_EYES_CLOSED: 0.5,
  LUMA_MIN: 70, LUMA_MAX: 190,          // server brightness range is 60..200 on the face crop
  // HEAD_MOTION: same rule as the server (face_service/app/config.py motion_*). Direction, order and shape are free.
  MOTION_YAW_DEG: 10, MOTION_PITCH_DEG: 7, MOTION_BINS: 8, MOTION_MIN_BINS: 5,
  MOTION_MARGIN: 1.1,       // the server re-measures the JPEGs; ask for a little more than its m >= 1
  MOTION_MIN_SPAN_MS: 1000, // server rejects motion shorter than 800 ms between first and last motion frame
  MOTION_TIMEOUT_MS: 10000, MAX_RESTARTS: 2,
  NEUTRAL_TIMEOUT_MS: 30000, RETURN_TIMEOUT_MS: 10000, RETURN_STEADY_MS: 300,
  RETURN_BLINK_MARGIN: 0.12,
  NEUTRAL_FRAMES: 3, NEUTRAL_GAP_MS: 200, RETURN_FRAMES: 2, RETURN_GAP_MS: 150,
  JPEG_QUALITY: 0.9,
};

// Reason code (from the server or the client) -> text. The server never sends scores or thresholds.
function friendly(reason, challenge) {
  const map = {
    motion_insufficient: 'Move your head a little further',
    face_too_small: 'Move closer',
    too_dark: 'Too dark. Face a light',
    too_bright: 'Too bright. Avoid strong light on or behind you',
    too_blurry: 'The picture was blurry. Hold still',
    not_neutral: 'Relax your face and look straight at the camera',
    sunglasses: 'Remove sunglasses or mask',
    mask: 'Remove sunglasses or mask',
    hand: 'Keep your hands away from your face',
    other: 'Make sure nothing is covering your face',
    multiple_faces: 'Only one face please',
    no_face: 'Keep your face in view',
    face_lost: 'Keep your face in view',
    verification_failed: 'Verification failed. Please try again using the live camera',
    bad_frame_count: 'Something went wrong with the capture. Please try again',
    bad_image: 'Something went wrong with the capture. Please try again',
    service_unavailable: 'The service is busy. Please try again in a moment',
    challenge_timeout: "We couldn't see enough movement. Please try again",
    neutral_timeout: "We couldn't get a clear view of your face. Face a light, centre your face and try again",
    return_timeout: 'Keep your face in view and look straight at the camera',
    duplicate: 'This face is already linked to another account',
    already_verified: 'This account is already face-verified. To re-test, use a new user ID or delete its row from face_embeddings',
    review: 'We need to review your verification. This usually takes a short while',
  };
  return map[reason] ?? 'Please try again';
}

class FlowError extends Error { constructor(reason) { super(reason); this.reason = reason; } }

// ---- Face landmarker -------------------------------------------------------------------------------
let landmarker = null, delegate = null;

async function createLandmarker(del) {
  const fileset = await FilesetResolver.forVisionTasks('/vendor/mediapipe/wasm');
  return FaceLandmarker.createFromOptions(fileset, {
    baseOptions: { modelAssetPath: '/models/face_landmarker.task', delegate: del },
    runningMode: 'VIDEO',
    numFaces: 2,                                  // 2 so we can say "only one face please"
    outputFaceBlendshapes: true,
    outputFacialTransformationMatrixes: true,
  });
}

async function ensureLandmarker() {
  if (landmarker) return;
  let lastErr;
  for (const del of ['GPU', 'CPU']) {
    try { landmarker = await createLandmarker(del); delegate = del; return; } catch (e) { lastErr = e; }
  }
  throw lastErr;
}

// ---- Detection loop + rolling frame buffer -----------------------------------------------------------
const video = $('video');
const bufCanvas = document.createElement('canvas');
const bufCtx = bufCanvas.getContext('2d');
const detCanvas = document.createElement('canvas');
const detCtx = detCanvas.getContext('2d');
const lumaCanvas = Object.assign(document.createElement('canvas'), { width: 16, height: 16 });
const lumaCtx = lumaCanvas.getContext('2d', { willReadFrequently: true });

let running = false, loopId = 0, detLong = T.DET_STEPS[0], lastTs = 0, lastStore = 0, lastLuma = 0, luma = null;
let fpsCount = 0, fpsSince = 0, fpsHold = 0;
let buffer = [];                 // {t, bitmap, blink, yaw, pitch, noseDx, noseDy, ok}
let waiters = [];                // pending nextEntry() calls
let onFace = null;               // current stage's per-frame handler
let sessionStart = 0;

function scheduleFrame(cb, id) {
  if ('requestVideoFrameCallback' in HTMLVideoElement.prototype) video.requestVideoFrameCallback(() => cb(id));
  else requestAnimationFrame(() => cb(id));
}

function readFace(res, t) {
  const n = res.faceLandmarks?.length ?? 0;
  const f = { t, n };
  if (n !== 1) return f;
  const lm = res.faceLandmarks[0];
  let minX = 1, maxX = 0, minY = 1, maxY = 0;
  for (const p of lm) {
    if (p.x < minX) minX = p.x; if (p.x > maxX) maxX = p.x;
    if (p.y < minY) minY = p.y; if (p.y > maxY) maxY = p.y;
  }
  f.cx = (minX + maxX) / 2; f.cy = (minY + maxY) / 2; f.w = maxX - minX; f.h = maxY - minY;
  f.minSidePx = Math.min(f.w * bufCanvas.width, f.h * bufCanvas.height);

  const sh = {};
  for (const c of res.faceBlendshapes?.[0]?.categories ?? []) sh[c.categoryName] = c.score;
  f.blink = ((sh.eyeBlinkLeft ?? 0) + (sh.eyeBlinkRight ?? 0)) / 2;
  f.mouth = Math.max(sh.jawOpen ?? 0, sh.mouthSmileLeft ?? 0, sh.mouthSmileRight ?? 0, sh.mouthPucker ?? 0, sh.mouthFunnel ?? 0);

  // Pose from the transformation matrix. The layout (row/column major) is detected from where the
  // translation sits, so this does not depend on how the bundle flattens it. Only magnitudes and
  // differences are used. The nose offset below only orients the on-screen ring.
  const d = res.facialTransformationMatrixes?.[0]?.data;
  if (d && d.length >= 16) {
    const rowMajor = Math.abs(d[3]) + Math.abs(d[7]) + Math.abs(d[11]) > Math.abs(d[12]) + Math.abs(d[13]) + Math.abs(d[14]);
    const r = (i, j) => (rowMajor ? d[i * 4 + j] : d[j * 4 + i]);
    f.yaw = Math.atan2(r(0, 2), r(2, 2)) * 180 / Math.PI;
    f.pitch = Math.atan2(-r(1, 2), Math.hypot(r(0, 2), r(2, 2))) * 180 / Math.PI;
  } else { f.yaw = 0; f.pitch = 0; }

  // Same geometry as the server (nose x relative to the eye midpoint, in eye distances) on the
  // UN-mirrored frame: > 0 means the head is turned to the subject's left.
  const eyeR = lm[33], eyeL = lm[263], nose = lm[1];
  const ipd = Math.max(Math.abs(eyeL.x - eyeR.x), 1e-3);
  f.noseDx = (nose.x - (eyeR.x + eyeL.x) / 2) / ipd;
  f.noseDy = (nose.y - (eyeR.y + eyeL.y) / 2) / ipd;
  return f;
}

// Face position in oval/stage coordinates (object-fit: cover). Mirroring does not matter: the
// checks are symmetric around the stage centre.
function stagePos(f) {
  const W = $('stage').clientWidth, H = $('stage').clientHeight;
  const vw = video.videoWidth, vh = video.videoHeight;
  const sc = Math.max(W / vw, H / vh);
  return {
    x: (f.cx * vw * sc - (vw * sc - W) / 2) / W,
    y: (f.cy * vh * sc - (vh * sc - H) / 2) / H,
    h: (f.h * vh * sc) / H,
  };
}

function sampleLuma(f) {
  const x = Math.max(0, f.cx - f.w / 2) * bufCanvas.width, y = Math.max(0, f.cy - f.h / 2) * bufCanvas.height;
  lumaCtx.drawImage(bufCanvas, x, y, f.w * bufCanvas.width, f.h * bufCanvas.height, 0, 0, 16, 16);
  const px = lumaCtx.getImageData(0, 0, 16, 16).data;
  let sum = 0;
  for (let i = 0; i < px.length; i += 4) sum += 0.299 * px[i] + 0.587 * px[i + 1] + 0.114 * px[i + 2];
  luma = sum / 256;
}

const bad = (msg) => ({ ok: false, msg });

// Is this frame a good "looking straight" frame? Returns guidance text when not.
function guidance(f, { maxBlink = T.NEUTRAL_EYES_CLOSED } = {}) {
  if (f.n === 0) return bad('Centre your face');
  if (f.n > 1) return bad('Only one face please');
  if (f.minSidePx < T.MIN_FACE_PX) return bad('Move closer');
  const s = stagePos(f);
  if (s.h > 0.92) return bad('Move back a little');
  if (Math.abs(s.x - 0.5) > T.CENTRE_TOL || Math.abs(s.y - 0.5) > T.CENTRE_TOL) return bad('Centre your face');
  if (luma !== null && luma < T.LUMA_MIN) return bad('Too dark');
  if (luma !== null && luma > T.LUMA_MAX) return bad('Too bright');
  if (Math.abs(f.yaw) > T.NEUTRAL_YAW || Math.abs(f.pitch) > T.NEUTRAL_PITCH) return bad('Look straight at the camera');
  if (f.mouth > T.NEUTRAL_MOUTH) return bad('Relax your face');
  if (f.blink > maxBlink) return bad('Open your eyes');
  return { ok: true, msg: '' };
}

function pushEntry(e) {
  buffer.push(e);
  while (buffer.length > T.BUF_MAX) buffer.shift().bitmap.close();   // free evicted frames right away
  waiters = waiters.filter((w) => !w.try(e));
}

async function onVideoFrame(id) {
  if (!running || id !== loopId) return;          // a stale callback from a previous run
  if (video.readyState < 2 || !video.videoWidth) return scheduleFrame(onVideoFrame, id);
  const t = performance.now();

  // Downscale once for the buffer; detect on it (or on a smaller copy if the device is struggling).
  const k = Math.min(1, T.BUF_LONG / Math.max(video.videoWidth, video.videoHeight));
  const bw = Math.round(video.videoWidth * k), bh = Math.round(video.videoHeight * k);
  if (bufCanvas.width !== bw || bufCanvas.height !== bh) { bufCanvas.width = bw; bufCanvas.height = bh; }
  bufCtx.drawImage(video, 0, 0, bw, bh);   // un-mirrored
  let src = bufCanvas;
  if (detLong < T.BUF_LONG) {
    const dk = detLong / T.BUF_LONG;
    detCanvas.width = Math.round(bw * dk); detCanvas.height = Math.round(bh * dk);
    detCtx.drawImage(bufCanvas, 0, 0, detCanvas.width, detCanvas.height);
    src = detCanvas;
  }

  let res = null;
  try {
    lastTs = Math.max(Math.floor(t), lastTs + 1);
    res = landmarker.detectForVideo(src, lastTs);
  } catch (e) {
    if (delegate === 'GPU') {            // GPU delegate can fail at first use on some devices
      try { landmarker = await createLandmarker('CPU'); delegate = 'CPU'; lastTs = 0; } catch { /* surfaces as no face */ }
    }
  }

  // FPS check: shrink the detection input when we cannot keep up.
  fpsCount++;
  if (t - fpsSince >= 1000) {
    const fps = fpsCount * 1000 / (t - fpsSince);
    fpsCount = 0; fpsSince = t;
    if (fps < T.FPS_FLOOR && t > fpsHold) {
      const i = T.DET_STEPS.indexOf(detLong);
      if (i < T.DET_STEPS.length - 1) { detLong = T.DET_STEPS[i + 1]; fpsHold = t + 2000; }
    }
  }

  if (res) {
    const f = readFace(res, t);
    if (f.n === 1 && t - lastLuma > 250) { lastLuma = t; sampleLuma(f); }
    if (f.n !== 1) luma = null;
    const g = guidance(f);
    if (f.n === 1 && t - lastStore >= T.BUF_MIN_GAP_MS) {
      lastStore = t;
      const meta = { t, blink: f.blink, yaw: f.yaw, pitch: f.pitch, noseDx: f.noseDx, noseDy: f.noseDy, ok: g.ok };
      createImageBitmap(bufCanvas).then((bitmap) => {
        if (running) pushEntry({ ...meta, bitmap }); else bitmap.close();
      });
    }
    f.guide = g;
    f.snapshot = () => createImageBitmap(bufCanvas);   // exactly this frame, un-mirrored, 640px
    onFace?.(f, t);
  }
  scheduleFrame(onVideoFrame, id);
}

function startLoop() {
  running = true; loopId++; lastTs = 0; lastStore = 0; lastLuma = 0; luma = null; detLong = T.DET_STEPS[0];
  fpsCount = 0; fpsSince = performance.now(); fpsHold = 0;
  scheduleFrame(onVideoFrame, loopId);
}

function stopLoop() {
  running = false; onFace = null;
  waiters = [];
  buffer.forEach((e) => e.bitmap.close());
  buffer = [];
}

// ---- Stage helpers -----------------------------------------------------------------------------------
// Runs `handler(face, t)` on every detection until it returns a value (resolved) or the timeout hits.
function stage(handler, timeoutMs) {
  return new Promise((resolve) => {
    const to = setTimeout(() => { onFace = null; resolve({ timeout: true }); }, timeoutMs);
    onFace = (f, t) => {
      const r = handler(f, t);
      if (r !== undefined) { clearTimeout(to); onFace = null; resolve(r); }
    };
  });
}

// Next stored frame at/after `target` (optionally only "good" frames), or null on timeout.
function nextEntry(target, needOk, timeoutMs) {
  return new Promise((resolve) => {
    const w = { try: (e) => { if (e.t >= target && (!needOk || e.ok)) { clearTimeout(to); resolve(e); return true; } return false; } };
    const to = setTimeout(() => { waiters = waiters.filter((x) => x !== w); resolve(null); }, timeoutMs);
    waiters.push(w);
  });
}

const take = (e) => { buffer = buffer.filter((x) => x !== e); return e; };

async function collectSpaced(count, gapMs, needOk) {
  const out = [];
  let target = performance.now();
  for (let i = 0; i < count; i++) {
    const e = await nextEntry(target, needOk, 2500);
    if (!e) { out.forEach((x) => x.bitmap.close()); return null; }
    out.push(take(e));
    target = e.t + gapMs;
  }
  return out;
}

const encCanvas = document.createElement('canvas');
async function encode(entries, phase) {
  const out = [];
  for (const e of entries) {
    encCanvas.width = e.bitmap.width; encCanvas.height = e.bitmap.height;
    encCanvas.getContext('2d').drawImage(e.bitmap, 0, 0);   // un-mirrored
    const blob = await new Promise((r) => encCanvas.toBlob(r, 'image/jpeg', T.JPEG_QUALITY));
    e.bitmap.close();
    out.push({ blob, phase, ts: Math.round(e.t - sessionStart) });
  }
  return out;
}

// ---- UI ----------------------------------------------------------------------------------------------
function setPrompt(text) { $('prompt').textContent = text; }
function setGuide(g) {
  $('guide').textContent = g.ok ? '' : g.msg;
  $('guide').classList.toggle('ok', g.ok);
  $('oval').classList.toggle('go', g.ok);
}
function hideCues() { $('ring').classList.remove('show'); }
async function flashCheck() { $('check').classList.add('show'); await sleep(700); $('check').classList.remove('show'); }

// ---- Stages ------------------------------------------------------------------------------------------
async function neutralStage() {
  setPrompt('Look straight at the camera. Relax your face.');
  const deadline = performance.now() + T.NEUTRAL_TIMEOUT_MS;
  for (;;) {
    let since = null, ref = null;
    const r = await stage((f, t) => {
      setGuide(f.guide);
      if (!f.guide.ok) { since = null; return; }
      const s = stagePos(f);
      if (since === null || Math.hypot(s.x - ref.x, s.y - ref.y) > T.STEADY_DRIFT) { since = t; ref = s; }
      if (t - since >= T.STEADY_MS) return { ok: true };
    }, Math.max(1, deadline - performance.now()));
    if (r.timeout) throw new FlowError('neutral_timeout');
    const entries = await collectSpaced(T.NEUTRAL_FRAMES, T.NEUTRAL_GAP_MS, true);
    if (entries) {
      const med = (k) => median(entries.map((e) => e[k]));
      const base = { blink: med('blink'), yaw: med('yaw'), pitch: med('pitch'), noseDx: med('noseDx'), noseDy: med('noseDy') };
      return { frames: await encode(entries, 'NEUTRAL'), base };
    }
    if (performance.now() > deadline) throw new FlowError('neutral_timeout');
  }
}

// ---- HEAD_MOTION ---------------------------------------------------------------------------------
// Ring of 8 screen sectors around the oval. A sector lights when the head reaches it. It never shows
// which sectors are missing and never says where to go next.
const RING = { cx: 150, cy: 200, rx: 102, ry: 164 };
function buildRing() {
  const NS = 'http://www.w3.org/2000/svg';
  $('ring').replaceChildren();
  for (let k = 0; k < T.MOTION_BINS; k++) {
    const a0 = (k * 360) / T.MOTION_BINS + 4, a1 = ((k + 1) * 360) / T.MOTION_BINS - 4;
    const pts = [];
    for (let i = 0; i <= 8; i++) {
      const a = ((a0 + ((a1 - a0) * i) / 8) * Math.PI) / 180;
      pts.push(`${(RING.cx + RING.rx * Math.cos(a)).toFixed(1)} ${(RING.cy - RING.ry * Math.sin(a)).toFixed(1)}`);
    }
    const path = document.createElementNS(NS, 'path');
    path.setAttribute('d', `M${pts.join(' L')}`);
    $('ring').appendChild(path);
  }
}

// Raw sector (angle of the yaw/pitch offset) -> sector on screen. The pose matrix signs are arbitrary,
// so the mapping is learned from the nose position in the (mirrored) preview: screen-right is the
// nose moving toward image-left, screen-up is the nose moving up. Only whole-sector flips are
// possible, so lit sectors always map one-to-one.
function screenSector(bin, cal) {
  const theta = ((bin + 0.5) * 2 * Math.PI) / T.MOTION_BINS;
  const x = (cal.x >= 0 ? 1 : -1) * Math.cos(theta), y = (cal.y >= 0 ? 1 : -1) * Math.sin(theta);
  const phi = (Math.atan2(y, x) + 2 * Math.PI) % (2 * Math.PI);
  return Math.floor(phi / (2 * Math.PI / T.MOTION_BINS)) % T.MOTION_BINS;
}

function drawRing(bins, cal) {
  const lit = new Set([...bins].map((b) => screenSector(b, cal)));
  [...$('ring').children].forEach((p, k) => p.classList.toggle('lit', lit.has(k)));
}

async function motionStage(base, state) {
  for (;;) {
    buildRing();
    $('ring').classList.add('show');
    setGuide({ ok: false, msg: '' });
    setPrompt('Slowly move your head around in a circle');

    const best = new Map();          // raw sector -> { m, t, bitmap: Promise<ImageBitmap> } (largest magnitude so far)
    const cal = { x: 0, y: 0 };      // evidence for the on-screen orientation of yaw / pitch
    const promptT = performance.now();
    state.promptTs = Math.round(promptT - sessionStart);

    const r = await stage((f, t) => {
      if (f.n !== 1) return;
      const dyaw = f.yaw - base.yaw, dpitch = f.pitch - base.pitch;
      const dNose = f.noseDx - base.noseDx, dNoseY = f.noseDy - base.noseDy;
      if (Math.abs(dyaw) > 3 && Math.abs(dNose) > 0.03) cal.x += dyaw * -dNose;
      if (Math.abs(dpitch) > 2 && Math.abs(dNoseY) > 0.02) cal.y += dpitch * -dNoseY;

      const nx = dyaw / T.MOTION_YAW_DEG, ny = dpitch / T.MOTION_PITCH_DEG, m = Math.hypot(nx, ny);
      if (m >= T.MOTION_MARGIN) {
        const bin = Math.floor((((Math.atan2(ny, nx) + 2 * Math.PI) % (2 * Math.PI)) / (2 * Math.PI)) * T.MOTION_BINS) % T.MOTION_BINS;
        const cur = best.get(bin);
        if (!cur || m > cur.m) {
          cur?.bitmap.then((b) => b.close());
          best.set(bin, { m, t, bitmap: f.snapshot() });
        }
      }
      drawRing(best.keys(), cal);
      if (best.size > 0) setGuide({ ok: false, msg: 'Keep going, move slowly' });

      const times = [...best.values()].map((v) => v.t);
      const span = times.length ? Math.max(...times) - Math.min(...times) : 0;
      if (best.size >= T.MOTION_MIN_BINS && span >= T.MOTION_MIN_SPAN_MS) return { done: true };
    }, T.MOTION_TIMEOUT_MS);

    if (!r.timeout) {
      const picked = [...best.values()].sort((a, b) => a.t - b.t);
      const entries = await Promise.all(picked.map(async (v) => ({ t: v.t, bitmap: await v.bitmap })));
      hideCues();
      setGuide({ ok: false, msg: '' });
      await flashCheck();
      return encode(entries, 'CHALLENGE');
    }
    best.forEach((v) => v.bitmap.then((b) => b.close()));
    hideCues();
    if (state.restarts >= T.MAX_RESTARTS) throw new FlowError('challenge_timeout');
    state.restarts++;
    setGuide({ ok: false, msg: '' });
    setPrompt("Let's try once more, move a little further");
    await sleep(1500);
  }
}

async function returnStage(base) {
  setPrompt('Look straight again');
  const opts = { maxBlink: base.blink + T.RETURN_BLINK_MARGIN };
  let since = null;
  const r = await stage((f, t) => {
    const g = f.n === 1 ? guidance(f, opts) : f.guide;
    setGuide(g);
    if (!g.ok) { since = null; return; }
    since ??= t;
    if (t - since >= T.RETURN_STEADY_MS) return { ok: true };
  }, T.RETURN_TIMEOUT_MS);
  if (r.timeout) throw new FlowError('return_timeout');
  const entries = await collectSpaced(T.RETURN_FRAMES, T.RETURN_GAP_MS, false);
  if (!entries) throw new FlowError('return_timeout');
  return encode(entries, 'RETURN');
}

// ---- API ---------------------------------------------------------------------------------------------
async function api(path, opts, token) {
  const res = await fetch(path, { ...opts, headers: { ...(opts?.headers), Authorization: `Bearer ${token}` } });
  const body = await res.json().catch(() => ({}));
  return { status: res.status, body };
}

function tooManyMessage(body) {
  const mins = Math.max(1, Math.ceil((body.retryAfterSec ?? 60) / 60));
  return `Too many attempts. Please wait about ${mins} minute${mins > 1 ? 's' : ''} and try again.`;
}

function cameraError(e) {
  if (!navigator.mediaDevices?.getUserMedia) return 'The camera is not available here. Open this page over HTTPS (or localhost).';
  switch (e?.name) {
    case 'NotAllowedError': case 'PermissionDeniedError': case 'SecurityError':
      return 'Camera access is needed to verify, please allow it in your settings';
    case 'NotFoundError': case 'OverconstrainedError': return 'No camera was found on this device';
    case 'NotReadableError': case 'AbortError': return 'The camera is in use by another app. Close it and try again';
    default: return 'We could not start the camera. Please check your settings and try again';
  }
}

function explain(b, challenge) {
  const d = b.debug;
  const lines = [];
  const code = b.reason ?? d?.reason;
  lines.push(code ? friendly(code, d?.challenge ?? challenge) : (b.message ?? ''));
  if (code) lines.push(`Reason: ${code}`);
  if (d) lines.push(`Challenge: ${d.challenge} · liveness: ${d.liveness.toFixed(2)} · top similarity: ${d.topSimilarity.toFixed(2)}`);
  return lines.filter(Boolean).join('\n');
}

function show(status, detail) {
  $('resCard').hidden = false;
  $('result').className = status;
  $('result').textContent = status;
  $('detail').textContent = detail || '';
}

// ---- Flow --------------------------------------------------------------------------------------------
let stream;

async function run() {
  $('start').disabled = true;
  $('resCard').hidden = true;
  let challenge;
  try {
    const sub = uid();
    const t = await fetch(`/dev/token?sub=${encodeURIComponent(sub)}`);
    if (!t.ok) throw new Error('Could not get a dev token (is DEV_MODE on for the api?)');
    const { token } = await t.json();

    $('camCard').hidden = false;
    try {
      stream = await navigator.mediaDevices.getUserMedia({
        video: { facingMode: 'user', width: { ideal: 1280 }, height: { ideal: 720 }, frameRate: { ideal: 30 } },
      });
    } catch (e) { throw new Error(cameraError(e)); }
    video.srcObject = stream;
    await new Promise((r) => (video.onloadedmetadata = r));
    await video.play().catch(() => {});

    $('loading').classList.add('show');
    try { await ensureLandmarker(); } catch (e) { console.error(e); throw new Error('Face detection could not be loaded. Please try again.'); }
    $('loading').classList.remove('show');

    const s = await api('/v1/face/session', { method: 'POST' }, token);
    if (s.status === 429) throw new Error(tooManyMessage(s.body));
    if (s.status !== 200) throw new Error(`Session failed: ${s.body.error ?? s.status}`);
    const { sessionId } = s.body;
    challenge = s.body.challenge;
    if (challenge !== 'HEAD_MOTION') throw new Error(`Unsupported challenge: ${challenge}`);

    sessionStart = performance.now();
    startLoop();
    const state = { restarts: 0, promptTs: 0 };

    const neutral = await neutralStage();
    const chal = await motionStage(neutral.base, state);
    const ret = await returnStage(neutral.base);

    setGuide({ ok: false, msg: '' });
    $('oval').classList.remove('go');
    setPrompt('Checking...');
    stopLoop();

    const all = [...neutral.frames, ...chal, ...ret];
    const form = new FormData();
    form.append('sessionId', sessionId);
    form.append('meta', JSON.stringify(all.map((f) => ({ phase: f.phase, ts: f.ts }))));
    form.append('promptTs', String(state.promptTs));
    form.append('restarts', String(state.restarts));
    all.forEach((f, i) => form.append('frames', f.blob, `f${i}.jpg`));
    const v = await api('/v1/face/verify', { method: 'POST', body: form }, token);

    if (v.status === 429) throw new Error(tooManyMessage(v.body));
    if (v.status === 410) throw new Error('The session expired. Please start again.');
    if (v.status !== 200 && !v.body.status) throw new Error(`Verify failed: ${v.body.error ?? v.status}`);
    show(v.body.status ?? 'ERROR', explain(v.body, challenge));
  } catch (e) {
    if (e instanceof FlowError) show('RETRY', friendly(e.reason, challenge));
    else show('ERROR', e.message);
  } finally {
    stopLoop();
    stream?.getTracks().forEach((tr) => tr.stop());
    video.srcObject = null;
    $('camCard').hidden = true;
    $('loading').classList.remove('show');
    hideCues(); setGuide({ ok: false, msg: '' }); $('oval').classList.remove('go');
    setPrompt('');
    $('start').disabled = false;
  }
}

// The test user ID is made automatically and kept in this browser; "new test user" starts from scratch
// (a new ID has no face enrolled yet, so it can verify again).
const uid = () => (localStorage.devUid ||= String(1000000 + Math.floor(Math.random() * 9000000)));
$('uid').textContent = uid();
$('newUser').addEventListener('click', (e) => { e.preventDefault(); localStorage.devUid = ''; $('uid').textContent = uid(); });
$('start').addEventListener('click', run);
</script>
</body>
