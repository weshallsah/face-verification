<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Face Verification Test</title>
<style>
  :root { --bg:#f5f6f8; --card:#fff; --text:#1c1f24; --muted:#6b7280; --accent:#2563eb; --ok:#16a34a; --bad:#dc2626; --warn:#d97706; --border:#e5e7eb; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#0f1115; --card:#181b21; --text:#e8eaed; --muted:#9aa0a6; --border:#2a2f38; }
  }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--text); font:16px/1.5 system-ui, sans-serif; }
  main { max-width:520px; margin:0 auto; padding:24px 16px; }
  h1 { font-size:20px; margin:0 0 4px; }
  p.sub { color:var(--muted); margin:0 0 16px; font-size:14px; }
  .card { background:var(--card); border:1px solid var(--border); border-radius:12px; padding:16px; margin-bottom:16px; }
  label { font-size:13px; color:var(--muted); display:block; margin-bottom:4px; }
  input { width:100%; padding:10px; border:1px solid var(--border); border-radius:8px; background:var(--bg); color:var(--text); font-size:16px; }
  button { width:100%; margin-top:12px; padding:12px; border:0; border-radius:8px; background:var(--accent); color:#fff; font-size:16px; cursor:pointer; }
  button:disabled { opacity:.5; cursor:default; }
  .stage { position:relative; aspect-ratio:3/4; background:#000; border-radius:12px; overflow:hidden; }
  video { width:100%; height:100%; object-fit:cover; transform:scaleX(-1); }
  .oval { position:absolute; inset:12% 20%; border:3px solid rgba(255,255,255,.7); border-radius:50%; transition:border-color .2s; }
  .oval.go { border-color:#22c55e; }
  .prompt { position:absolute; left:0; right:0; top:0; text-align:center; color:#fff; font-weight:700; font-size:20px; line-height:1.3; padding:16px 12px 28px; background:linear-gradient(rgba(0,0,0,.75), rgba(0,0,0,0)); text-shadow:0 1px 4px #000; }
  .prompt:empty { display:none; }
  #result { font-weight:600; }
  #result.VERIFIED { color:var(--ok); } #result.DUPLICATE,#result.FAILED { color:var(--bad); }
  #result.RETRY,#result.IN_REVIEW,#result.ALREADY_VERIFIED { color:var(--warn); }
  .muted { color:var(--muted); font-size:13px; white-space:pre-line; }
</style>
</head>
<body>
<main>
  <h1>Face Verification Test</h1>
  <p class="sub">Local test tool. Uses a dev-only token endpoint. <a href="/dashboard.html" style="color:var(--accent)">Data dashboard</a></p>

  <div class="card">
    <label for="uid">User ID (numeric)</label>
    <input id="uid" inputmode="numeric" value="1001">
    <button id="start">Start verification</button>
  </div>

  <div class="card" id="camCard" hidden>
    <div class="stage">
      <video id="video" autoplay playsinline muted></video>
      <div class="oval" id="oval"></div>
      <div class="prompt" id="prompt"></div>
    </div>
  </div>

  <div class="card" id="resCard" hidden>
    <div id="result"></div>
    <div class="muted" id="detail"></div>
  </div>
</main>

<script>
const $ = (id) => document.getElementById(id);
const sleep = (ms) => new Promise((r) => setTimeout(r, ms));

const INSTRUCTIONS = {
  BLINK: 'Now blink slowly, once',
  TURN_LEFT: 'Now turn your head to your left, then hold',
  TURN_RIGHT: 'Now turn your head to your right, then hold',
};
// Challenge window: delay after the prompt, frame count and spacing (max 10 frames total: 2 + n + 2).
// Blink gets more, denser frames because a blink lasts only ~150–300 ms.
const CHALLENGE_CAPTURE = {
  BLINK: { delay: 300, n: 6, interval: 150 },
  TURN_LEFT: { delay: 1000, n: 4, interval: 350 },
  TURN_RIGHT: { delay: 1000, n: 4, interval: 350 },
};

let stream;

function setPrompt(text) { $('prompt').textContent = text; }

function grab() {
  const v = $('video');
  // 1280 keeps a face at laptop distance above min_face_px (120) even when turned
  const scale = Math.min(1, 1280 / Math.max(v.videoWidth, v.videoHeight));
  const c = document.createElement('canvas');
  c.width = Math.round(v.videoWidth * scale);
  c.height = Math.round(v.videoHeight * scale);
  c.getContext('2d').drawImage(v, 0, 0, c.width, c.height);   // un-mirrored
  return new Promise((res) => c.toBlob(res, 'image/jpeg', 0.85));
}

async function capture(n, intervalMs) {
  const out = [];
  for (let i = 0; i < n; i++) {
    out.push(await grab());
    if (i < n - 1) await sleep(intervalMs);
  }
  return out;
}

async function api(path, opts, token) {
  const res = await fetch(path, { ...opts, headers: { ...(opts?.headers), Authorization: `Bearer ${token}` } });
  const body = await res.json().catch(() => ({}));
  return { status: res.status, body };
}

const REASONS = {
  challenge: 'The %CHALLENGE% action was not detected in the frames. Do it slowly and clearly when prompted; for a turn, turn at least ~15° then come back to centre.',
  liveness: 'Liveness check scored too low.',
  face_changed_during_session: 'The face in the frames did not match across the session.',
  bad_frame_count: 'Wrong number of frames.',
  bad_image: 'A frame could not be decoded.',
  no_face: 'No face found in one of the frames.',
  multiple_faces: 'More than one face found in a frame.',
  face_too_small: 'Face too small: move closer.',
  not_neutral_or_low_quality: 'Fewer than 2 frames were neutral, sharp and well lit. Look straight, relax your face, improve lighting.',
  already_verified: 'This user ID already has an enrolled face. To re-test, use a new user ID or delete its row from face_embeddings.',
  duplicate: 'Matches an existing account.',
  review: 'Borderline match, queued for review.',
};

function explain(b) {
  const d = b.debug;
  const lines = [];
  if (b.message) lines.push(b.message);
  const code = d?.reason || b.reason;
  if (code) lines.push(`Reason: ${code}`);
  if (code && REASONS[code]) lines.push(REASONS[code].replace('%CHALLENGE%', d?.challenge ?? 'requested'));
  if (d) {
    lines.push(`Challenge: ${d.challenge} · liveness: ${d.liveness.toFixed(2)} · top similarity: ${d.topSimilarity.toFixed(2)}`);
  }
  return lines.join('\n');
}

function show(status, detail) {
  $('resCard').hidden = false;
  $('result').className = status;
  $('result').textContent = status;
  $('detail').textContent = detail || '';
}

async function run() {
  $('start').disabled = true;
  $('resCard').hidden = true;
  try {
    const sub = $('uid').value.trim();
    const t = await fetch(`/dev/token?sub=${encodeURIComponent(sub)}`);
    if (!t.ok) throw new Error('Could not get a dev token (is DEV_MODE on for the api?)');
    const { token } = await t.json();

    stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'user', width: { ideal: 1280 }, height: { ideal: 720 } } });
    $('video').srcObject = stream;
    $('camCard').hidden = false;
    await new Promise((r) => ($('video').onloadedmetadata = r));

    const s = await api('/v1/face/session', { method: 'POST' }, token);
    if (s.status === 429) throw new Error('Too many attempts. Wait a few minutes or use a different user ID.');
    if (s.status !== 200) throw new Error(`Session failed: ${s.body.error ?? s.status}`);
    const { sessionId, challenge } = s.body;

    setPrompt('Look straight at the camera. Relax your face.');
    await sleep(2000);
    $('oval').classList.add('go');

    const frames = [];
    frames.push(...await capture(2, 300));

    setPrompt(INSTRUCTIONS[challenge]);
    const cc = CHALLENGE_CAPTURE[challenge];
    await sleep(cc.delay);
    frames.push(...await capture(cc.n, cc.interval));

    setPrompt('Look straight again and hold still');
    await sleep(1200);
    frames.push(...await capture(2, 300));

    $('oval').classList.remove('go');
    setPrompt('Checking...');

    const form = new FormData();
    form.append('sessionId', sessionId);
    frames.forEach((b, i) => form.append('frames', b, `f${i}.jpg`));
    const v = await api('/v1/face/verify', { method: 'POST', body: form }, token);

    if (v.status !== 200 && !v.body.status) throw new Error(`Verify failed: ${v.body.error ?? v.status}`);
    show(v.body.status ?? 'ERROR', explain(v.body));
  } catch (e) {
    show('ERROR', e.message);
  } finally {
    stream?.getTracks().forEach((tr) => tr.stop());
    $('camCard').hidden = true;
    setPrompt('');
    $('start').disabled = false;
  }
}

$('start').addEventListener('click', run);
</script>
</body>
</html>
