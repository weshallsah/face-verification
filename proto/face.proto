syntax = "proto3";

package faceverify.v1;

service FaceVerifier {
  // First-time enrollment: liveness + 1:N duplicate search + insert.
  rpc Enroll (EnrollRequest) returns (EnrollResponse);
}

enum Challenge {
  CHALLENGE_UNSPECIFIED = 0;
  BLINK = 1;
  TURN_LEFT = 2;
  TURN_RIGHT = 3;
}

enum Verdict {
  VERDICT_UNSPECIFIED = 0;
  ACCEPTED = 1;        // new person, embedding stored
  DUPLICATE = 2;       // matches an existing account
  REVIEW = 3;          // borderline, queued for a human
  RETRY = 4;           // capture problem, see reason_code
  REJECTED_SPOOF = 5;  // liveness or challenge failed
  ALREADY_VERIFIED = 6; // this user_id already has an enrolled face
}

message EnrollRequest {
  string user_id = 1;
  string session_id = 2;
  Challenge challenge = 3;
  repeated bytes frames = 4;   // JPEGs in capture order
}

message EnrollResponse {
  Verdict verdict = 1;
  string reason_code = 2;      // e.g. "sunglasses", "multiple_faces", "not_neutral"
  float top_similarity = 3;    // for logging only; never shown to users
  float liveness_score = 4;
}
