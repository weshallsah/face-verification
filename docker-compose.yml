services:
  api:
    build:
      context: .
      dockerfile: backend/node-api/Dockerfile
    environment:
      JWT_SECRET: ${JWT_SECRET}
      REDIS_URL: redis://redis:6379
      FACE_GRPC_ADDR: face-service:50051
      DEV_MODE: "true"          # serves the test page and /dev/token; remove in production
      FACE_RATE_LIMIT: "100"    # attempts per 10 min per user; default is 5
      # /verify page config (served at /verify/config.json). Set real values in production.
      VERIFY_APP_NAME: "our app"
      VERIFY_LOGIN_URL: "/login"
      VERIFY_SUPPORT_URL: "https://example.com/support"      # "I think this is a mistake" opens this
      VERIFY_PRIVACY_URL: ""                                  # full privacy policy; link hidden when empty
      VERIFY_RETURN_ALLOWLIST: ""                             # comma-separated origins allowed as ?returnUrl=
      PGHOST: postgres          # dev-only DB viewer (/dev/db); not used outside DEV_MODE
      PGUSER: face_svc
      PGPASSWORD: ${FACE_DB_PASSWORD}
      PGDATABASE: app
    ports: ["${API_PORT:-3000}:3000"]   # override if 3000 is taken, e.g. API_PORT=3001
    depends_on: [redis, face-service]
    restart: unless-stopped

  face-service:
    build:
      context: .
      dockerfile: backend/python-face-service/Dockerfile.cpu   # GPU: add -f docker-compose.gpu.yml
    environment:
      # key/value form, so '@' and similar characters in the password are safe
      DATABASE_URL: "host=postgres port=5432 dbname=app user=face_svc password='${FACE_DB_PASSWORD}'"
      MODEL_VERSION: arcface-r50-w600k-v1
      DEV_MODE: "true"
      APP_ENV: development
    volumes:
      - ./backend/python-face-service/models:/app/models:ro
    expose: ["50051"]              # internal only
    depends_on: [postgres]
    restart: unless-stopped

  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: app
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      FACE_DB_PASSWORD: ${FACE_DB_PASSWORD}   # used by 002_face_svc_role.sh
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/migrations:/docker-entrypoint-initdb.d:ro
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no"]   # sessions are ephemeral
    restart: unless-stopped

volumes:
  pgdata:
